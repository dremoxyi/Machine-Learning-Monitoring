<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="inscription.js" defer></script>
    <link rel="stylesheet" href="connexion.css">
    <title>Inscription</title>
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <h1 class="auth-title">INSCRIPTION</h1>
            <p class="auth-switch">
                Deja inscrit ?
                <a href="connexion.html">Se connecter</a>
            </p>

            <div id="register-form" class="auth-form">
                <label for="register-email">Adresse mail</label>
                <input type="email" id="register-email" placeholder="Entrez votre adresse email">

                <label for="register-password">Mot de passe</label>
                <input type="password" id="register-password" placeholder="Entrez votre mot de passe">

                <button id="register-submit" type="button">Creer le compte</button>
            </div>
        </section>
    </main>
</body>
</html>
