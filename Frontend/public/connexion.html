<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="api.js" defer></script>
    <script src="connexion.js" defer></script>
    <link rel="stylesheet" href="connexion.css">
    <title>Connexion</title>
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <h1 class="auth-title">CONNEXION</h1>
            <p class="auth-switch">
                Pas encore de compte ?
                <a href="inscription.html">Créer un compte</a>
            </p>

            <form id="connexion-form" class="auth-form">
                <label for="username">Adresse mail</label>
                <input type="email" id="username" placeholder="Entrez votre adresse email">

                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="Entrez votre mot de passe">

                <button id="login-submit" type="submit">Valider</button>
            </form>
        </section>
    </main>
</body>
</html>
