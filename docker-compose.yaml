services:
  gateway:
    build: ./Gateway
    ports:
      - "8080:80"
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - frontend
      - api
    restart: unless-stopped

  frontend:
    build: ./Frontend
    networks:
      - frontend-net
    expose:
      - "80"
    restart: unless-stopped

  api:
    build: ./Backend
    networks:
      - backend-net
      - broker-net
    expose:
      - "8000"
    environment:
      - USERS_DATABASE_URL=postgresql://postgres:postgres@users-db:5432/users_db
      - METRICS_DATABASE_URL=postgresql://postgres:postgres@metrics-db:5432/metrics_db
      - LOGS_DATABASE_URL=postgresql://postgres:postgres@logs-db:5432/logs_db
      - JWT_SECRET=hello_blobi_blobo
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      users-db:
        condition: service_healthy
      metrics-db:
        condition: service_healthy
      logs-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  users-db:
    image: postgres:15-alpine
    networks:
      - backend-net
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=users_db
    volumes:
      - users_postgres_data:/var/lib/postgresql/data
      - ./Database/users-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  metrics-db:
    image: postgres:15-alpine
    networks:
      - backend-net
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=metrics_db
    volumes:
      - metrics_postgres_data:/var/lib/postgresql/data
      - ./Database/metrics-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metrics_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  logs-db:
    image: postgres:15-alpine
    networks:
      - backend-net
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=logs_db
    volumes:
      - logs_postgres_data:/var/lib/postgresql/data
      - ./Database/logs-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logs_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    networks:
      - broker-net
    expose:
      - "9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  trainer-pytorch:
    build:
      context: ./Trainer
      dockerfile: Dockerfile.pytorch
    networks:
      - broker-net
    volumes:
      - datasets:/data:ro
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - TRAINER_NAME=pytorch
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    restart: unless-stopped

  trainer-tensorflow:
    build:
      context: ./Trainer
      dockerfile: Dockerfile.tensorflow
    networks:
      - broker-net
    volumes:
      - datasets:/data:ro
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - TRAINER_NAME=tensorflow
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    restart: unless-stopped

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  broker-net:
    driver: bridge

volumes:
  users_postgres_data:
  metrics_postgres_data:
  logs_postgres_data:
  datasets:
  kafka_data: