services:
  gateway:
    build: ./Gateway
    ports:
      - "8080:80"
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - frontend
      - api
    restart: unless-stopped

  frontend:
    build: ./Frontend
    networks:
      - frontend-net
    expose:
      - "80"
    restart: unless-stopped

  api:
    build: ./Backend
    networks:
      backend-net:
        aliases:
          - api
      broker-net:
        aliases:
          - api
    expose:
      - "8000"
    environment:
      - USERS_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@users-db:5432/${POSTGRES_DB_USERS}
      - METRICS_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@metrics-db:5432/${POSTGRES_DB_METRICS}
      - LOGS_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@logs-db:5432/${POSTGRES_DB_LOGS}
      - JWT_SECRET=${JWT_SECRET}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_METRICS_TOPICS=${KAFKA_METRICS_TOPICS}
      - KAFKA_CONSUMER_GROUP_ID=${KAFKA_CONSUMER_GROUP_ID}
    depends_on:
      users-db:
        condition: service_healthy
      metrics-db:
        condition: service_healthy
      logs-db:
        condition: service_healthy
      kafka-topic-setup:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped

  users-db:
    image: postgres:15-alpine
    networks:
      backend-net:
        aliases:
          - users-db
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB_USERS}
    volumes:
      - users_postgres_data:/var/lib/postgresql/data
      - ./Database/users-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_USERS}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  metrics-db:
    image: postgres:15-alpine
    networks:
      backend-net:
        aliases:
          - metrics-db
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB_METRICS}
    volumes:
      - metrics_postgres_data:/var/lib/postgresql/data
      - ./Database/metrics-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_METRICS}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  logs-db:
    image: postgres:15-alpine
    networks:
      backend-net:
        aliases:
          - logs-db
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB_LOGS}
    volumes:
      - logs_postgres_data:/var/lib/postgresql/data
      - ./Database/logs-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_LOGS}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    networks:
      - broker-net
    expose:
      - "9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LOG_DIRS=/tmp/kraft-combined-logs
      - KAFKA_METADATA_LOG_DIR=/tmp/kraft-combined-logs
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - CLUSTER_ID=${KAFKA_CLUSTER_ID}
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  kafka-topic-setup:
    image: confluentinc/cp-kafka:7.6.1
    networks:
      - broker-net
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic metrics.trainer.pytorch --partitions 2 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic metrics.trainer.tensorflow --partitions 2 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --list
    restart: "no"

  dataset-downloader-cifar100:
    image: alpine:3.20
    networks:
      - broker-net
    volumes:
      - datasets:/data
      - ./scripts:/scripts:ro
    command:
      - sh
      - -c
      - apk add --no-cache bash curl tar ca-certificates >/dev/null && cp /scripts/download_cifar100.sh /tmp/download_cifar100.sh && sed -i 's/\r$//' /tmp/download_cifar100.sh && bash /tmp/download_cifar100.sh /data/cifar100
    restart: "no"

  dataset-downloader-fashion-mnist:
    image: alpine:3.20
    networks:
      - broker-net
    volumes:
      - datasets:/data
      - ./scripts:/scripts:ro
    command:
      - sh
      - -c
      - apk add --no-cache bash curl gzip ca-certificates >/dev/null && cp /scripts/download_fashion_mnist.sh /tmp/download_fashion_mnist.sh && sed -i 's/\r$//' /tmp/download_fashion_mnist.sh && bash /tmp/download_fashion_mnist.sh /data/fashion-mnist
    restart: "no"

  trainer-pytorch:
    build:
      context: ./Trainer
      dockerfile: Dockerfile.pytorch
    networks:
      - broker-net
    volumes:
      - datasets:/data:ro
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - TRAINER_NAME=pytorch
      - KAFKA_METRICS_TOPIC=metrics.trainer.pytorch
      - DATASET_NAMES=${DATASET_NAMES}
      - BATCH_SIZE=${BATCH_SIZE}
      - LEARNING_RATE=${LEARNING_RATE}
      - TRAIN_LOOP_SLEEP_SECONDS=${TRAIN_LOOP_SLEEP_SECONDS}
      - TRAIN_SEED=${TRAIN_SEED}
    depends_on:
      dataset-downloader-cifar100:
        condition: service_completed_successfully
      dataset-downloader-fashion-mnist:
        condition: service_completed_successfully
      kafka-topic-setup:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${TRAINER_CPU_LIMIT}"
          memory: ${TRAINER_MEMORY_LIMIT}
    restart: unless-stopped

  trainer-tensorflow:
    build:
      context: ./Trainer
      dockerfile: Dockerfile.tensorflow
    networks:
      - broker-net
    volumes:
      - datasets:/data:ro
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - TRAINER_NAME=tensorflow
      - KAFKA_METRICS_TOPIC=metrics.trainer.tensorflow
      - DATASET_NAMES=${DATASET_NAMES}
      - BATCH_SIZE=${BATCH_SIZE}
      - LEARNING_RATE=${LEARNING_RATE}
      - TRAIN_LOOP_SLEEP_SECONDS=${TRAIN_LOOP_SLEEP_SECONDS}
      - TRAIN_SEED=${TRAIN_SEED}
    depends_on:
      dataset-downloader-cifar100:
        condition: service_completed_successfully
      dataset-downloader-fashion-mnist:
        condition: service_completed_successfully
      kafka-topic-setup:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${TRAINER_CPU_LIMIT}"
          memory: ${TRAINER_MEMORY_LIMIT}
    restart: unless-stopped

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true
  broker-net:
    driver: bridge

volumes:
  users_postgres_data:
  metrics_postgres_data:
  logs_postgres_data:
  datasets:
